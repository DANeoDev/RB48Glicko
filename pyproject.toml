[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line length handled flexibly
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/database/__init__.py" = ["F403", "F401"]
