{% extends "base.html" %}

{% block title %}Dashboard – RB48{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
{% endblock %}

{% block content %}
<section class="dashboard-page">
    <div class="dashboard-content">
        <div class="dashboard-news card">
            <div class="dashboard-news-header">
                <h1>News</h1>
            </div>
            <div class="dashboard-news-content" aria-live="polite">
                {% if news %}
                    <article class="dashboard-news-item">{{ news.html | safe }}</article>
                {% else %}
                    <p class="dashboard-news-empty">No news yet.</p>
                {% endif %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
