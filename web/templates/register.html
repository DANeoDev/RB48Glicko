{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h1>Create account</h1>
    <form method="post" class="form-card">
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <label for="username">Username</label>
        <input id="username" name="username" required minlength="3" maxlength="30" value="{{ request.form.get('username', '') }}">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required maxlength="254" value="{{ request.form.get('email', '') }}">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8">

        <button type="submit">Create account</button>
    </form>
</div>
{% endblock %}
