<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RB48{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='footer.css') }}">
    {% block head %}{% endblock %}
    <style>
        .card { background: var(--modal-bg) !important; }
        .modal { background: var(--modal-bg) !important; border-color: var(--accent-dark) !important; color: #ffffff; }
        .modal h1, .modal h2, .modal h3, .modal h4, .modal strong { color: #ffffff; }
        .modal input, .modal select, .modal textarea { background: #24194A; color: #ffffff; border-color: #5A4A83; }
        .modal input::placeholder, .modal textarea::placeholder { color: #C9C2D8; }
        .primary { background: var(--accent) !important; color: #ffffff !important; border-color: var(--accent) !important; transition: background-color 0.15s ease, border-color 0.15s ease; }
        .primary:hover { background: var(--accent-hover) !important; border-color: var(--accent-hover) !important; }
        .add-btn { background: var(--accent-dark) !important; color: #ffffff !important; border-color: var(--accent-dark) !important; transition: background-color 0.15s ease, border-color 0.15s ease; }
        .add-btn:hover { background: var(--accent-hover) !important; border-color: var(--accent-hover) !important; }
    </style>
</head>

<body class="{% if request.endpoint in ['stats.home', 'stats.dashboard'] %}dashboard-body{% endif %}">
<header class="site-header">
    <nav class="navbar">
        <a class="logo" href="{{ url_for('stats.home') }}" aria-label="RB48 home">
            <img src="{{ url_for('static', filename='images/RB48_logo.png') }}" alt="RB48">
        </a>
        <div class="nav-links">
            <a href="{{ url_for('stats.dashboard') }}" class="{% if request.endpoint in ['stats.home', 'stats.dashboard'] %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('stats.stats') }}" class="{% if request.endpoint == 'stats.stats' %}active{% endif %}">Stats</a>
            <a href="{{ url_for('stats.match_history') }}" class="{% if request.endpoint == 'stats.match_history' %}active{% endif %}">Match History</a>
            <a href="{{ url_for('match_center.match_center') }}" class="{% if request.endpoint == 'match_center.match_center' %}active{% endif %}">Match Center</a>
            <a href="{{ url_for('stats.model_analysis') }}" class="{% if request.endpoint == 'stats.model_analysis' %}active{% endif %}">Model Analysis</a>
        </div>
        <div class="profile-menu">
            <button type="button" class="profile-button" aria-label="Account" title="Account">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M5 20c.7-3.3 3.2-5.2 7-5.2s6.3 1.9 7 5.2"></path>
                </svg>
            </button>
            <div class="profile-dropdown">
                {% if current_user %}
                    <div class="profile-dropdown-user">{{ current_user["username"] }}</div>
                    <a href="{{ url_for('auth.logout') }}">Log out</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}">Log in</a>
                    <a href="{{ url_for('auth.register') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer" id="site-footer">
    <div class="site-footer-inner">
        <a class="site-footer-home" href="{{ url_for('stats.home') }}">RB 48 Homepage</a>
        <nav class="site-footer-links" aria-label="Footer navigation">
            <a href="#">About</a>
            <a href="{{ url_for('stats.glicko_explainer') }}">FAQ</a>
            <a href="https://github.com/DANeoDev/RB48Glicko" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
    </div>
    <button type="button" class="site-footer-toggle" id="site-footer-toggle" aria-label="Hide footer" title="Hide footer">−</button>
</footer>
<button type="button" class="site-footer-reopen" id="site-footer-reopen" aria-label="Show footer" title="Show footer">+</button>
{% block scripts %}{% endblock %}
<script>
document.addEventListener("click", (event) => {
    const link = event.target.closest("a[data-preserve-scroll]");
    if (!link) return;
    sessionStorage.setItem("rb48ScrollPosition", window.scrollY);
});
window.addEventListener("load", () => {
    const position = sessionStorage.getItem("rb48ScrollPosition");
    if (position === null) return;
    window.scrollTo(0, Number(position));
    sessionStorage.removeItem("rb48ScrollPosition");
});
const footer = document.getElementById("site-footer");
const footerToggle = document.getElementById("site-footer-toggle");
const footerReopen = document.getElementById("site-footer-reopen");
if (footer && footerToggle && footerReopen) {
    footerToggle.addEventListener("click", () => {
        footer.classList.add("site-footer-hidden");
        footerReopen.classList.add("visible");
    });
    footerReopen.addEventListener("click", () => {
        footer.classList.remove("site-footer-hidden");
        footerReopen.classList.remove("visible");
    });
}
if (document.getElementById("leaderboard")) {
    document.querySelectorAll("#leaderboard tbody tr").forEach(row => {
        const totalGames = Number(row.dataset.totalGames), boxGames = Number(row.dataset.boxGames), hfGames = Number(row.dataset.hfGames);
        const totalRating = Number(row.dataset.totalRating), boxRating = Number(row.dataset.boxRating), hfRating = Number(row.dataset.hfRating);
        let pitch = null;
        if (totalGames > 0 && boxGames === totalGames && hfGames === 0 && totalRating !== boxRating) pitch = "BOX";
        else if (totalGames > 0 && hfGames === totalGames && boxGames === 0 && totalRating !== hfRating) pitch = "HF";
        if (!pitch) return;
        const playerLink = row.querySelector("td:nth-child(2) a");
        if (!playerLink) return;
        const player = playerLink.textContent.trim();
        playerLink.title = `How can the ratings diverge even though ${player} only has games in ${pitch}? Well, this is a good question, but it works as intended. If you can figure out the reason, send a Mail to the webmaster — he will grant you a reward.`;
    });
}
</script>
</body>
</html>
